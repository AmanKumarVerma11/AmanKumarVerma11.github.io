name: Dependency Report

# Regenerates .github/reports/dependencies.md and commits it only when it
# actually changed — i.e. when a new advisory landed, one was cleared, or a
# dependency fell behind. Quiet days produce no commit, which is the point:
# every commit here corresponds to a real change in the dependency surface.

on:
  schedule:
    - cron: '40 5 * * *'   # 05:40 UTC = 11:10 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Regenerate report
        run: npm run deps:report

      - name: Commit if it changed
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/reports/dependencies.md; then
            echo "No change in the dependency surface — nothing to commit."
            exit 0
          fi

          git config user.email "akverma11aug2002@gmail.com"
          git config user.name "aman"

          git add .github/reports/dependencies.md
          git commit -m "chore(deps): refresh dependency report [skip ci]"

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
